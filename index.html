<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Delay Cart</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-5xl mx-auto p-6">

  <section id="home" class="screen">
    <div class="bg-white p-10 rounded-3xl shadow text-center mt-10">
      <h1 class="text-5xl font-bold mb-4">Smart Delay Cart</h1>
      <p class="text-gray-600 mb-8">충동구매를 잠시 멈추고 더 가치 있는 소비를 도와주는 서비스</p>
      <button onclick="show('time')" class="bg-black text-white px-8 py-4 rounded-2xl">시작하기</button>
    </div>
  </section>

  <section id="time" class="screen hidden">
    <div class="bg-white p-8 rounded-3xl shadow mt-10">
      <h2 class="text-3xl font-bold mb-6">대기 시간 설정</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <button onclick="setTime(30)" class="bg-gray-100 p-4 rounded-xl">30분</button>
        <button onclick="setTime(60)" class="bg-gray-100 p-4 rounded-xl">1시간</button>
        <button onclick="setTime(1440)" class="bg-gray-100 p-4 rounded-xl">24시간</button>
        <button onclick="customTime()" class="bg-gray-100 p-4 rounded-xl">직접입력</button>
      </div>

      <p class="mb-6">현재 설정: <b id="selectedTime">30분</b></p>

      <div class="flex gap-3">
        <button onclick="show('home')" class="bg-gray-300 px-5 py-3 rounded-xl">이전</button>
        <button onclick="show('shop')" class="bg-black text-white px-5 py-3 rounded-xl">다음</button>
      </div>
    </div>
  </section>

  <section id="shop" class="screen hidden">
    <div class="bg-white p-8 rounded-3xl shadow mt-10">
      <h2 class="text-3xl font-bold mb-6">상품 추가</h2>

      <div class="grid md:grid-cols-3 gap-3 mb-3">
        <select id="category" class="border p-3 rounded-xl">
          <option>전자기기</option>
          <option>패션</option>
          <option>게임</option>
          <option>취미</option>
          <option>생활용품</option>
          <option>기타</option>
        </select>

        <input id="name" class="border p-3 rounded-xl" placeholder="상품명">
        <input id="price" type="number" class="border p-3 rounded-xl" placeholder="가격">
      </div>

      <textarea id="memo" class="border p-3 rounded-xl w-full mb-4" placeholder="왜 사고 싶은지 적어보세요"></textarea>

      <button onclick="addProduct()" class="bg-black text-white px-5 py-3 rounded-xl mb-6">상품 추가</button>

      <div id="productList" class="grid md:grid-cols-2 gap-4"></div>

      <div class="mt-6 flex gap-3">
        <button onclick="show('time')" class="bg-gray-300 px-5 py-3 rounded-xl">이전</button>
        <button onclick="show('cart')" class="bg-black text-white px-5 py-3 rounded-xl">장바구니</button>
      </div>
    </div>
  </section>

  <section id="cart" class="screen hidden">
    <div class="bg-white p-8 rounded-3xl shadow mt-10">
      <h2 class="text-3xl font-bold mb-6">장바구니</h2>

      <div class="grid md:grid-cols-3 gap-4 mb-6">
        <div class="bg-blue-100 p-4 rounded-xl">
          <div>절약 금액</div>
          <div id="savedMoney" class="text-2xl font-bold">₩0</div>
        </div>
        <div class="bg-green-100 p-4 rounded-xl">
          <div>취소 횟수</div>
          <div id="cancelCount" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-purple-100 p-4 rounded-xl">
          <div>대기 상품</div>
          <div id="waitingCount" class="text-2xl font-bold">0</div>
        </div>
      </div>

      <div id="cartList"></div>

      <div class="bg-black text-white p-6 rounded-2xl mt-6">
        <h3 class="text-2xl font-bold mb-3">절약하면 가능한 활동</h3>
        <ul class="list-disc ml-5">
          <li>독서 및 자기계발</li>
          <li>헬스장 등록</li>
          <li>여행 적금</li>
          <li>악기 레슨</li>
        </ul>
      </div>

      <button onclick="show('shop')" class="bg-gray-300 px-5 py-3 rounded-xl mt-6">이전</button>
    </div>
  </section>

</div>

<script>
async function saveCartItem(item) {

  const { error } = await supabase
    .from("cart_items")
    .insert({
      product_name: item.name,
      category: item.category,
      price: item.price,
      memo: item.memo,
      end_time: new Date(item.endTime).toISOString()
    });

  if(error){
    console.error(error);
  }
}
const SUPABASE_URL =
"https://leybfsimjxpkzbvijdwu.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ygXZraurJcTR2hLALLcR2A_8NrCyE5i";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
let selectedMinutes = 30;
let products = JSON.parse(localStorage.getItem("products") || "[]");
let cartItems = JSON.parse(localStorage.getItem("cartItems") || "[]");
let savedMoney = Number(localStorage.getItem("savedMoney") || 0);
let cancelCount = Number(localStorage.getItem("cancelCount") || 0);

function saveData(){
 localStorage.setItem("products",JSON.stringify(products));
 localStorage.setItem("cartItems",JSON.stringify(cartItems));
 localStorage.setItem("savedMoney",savedMoney);
 localStorage.setItem("cancelCount",cancelCount);
}

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function setTime(min){
 selectedMinutes=min;
 document.getElementById("selectedTime").innerText=min>=60?(min/60)+"시간":min+"분";
}

function customTime(){
 const v=prompt("분 단위 입력");
 if(v && !isNaN(v)) setTime(Number(v));
}

function addProduct(){
 const category=document.getElementById("category").value;
 const name=document.getElementById("name").value;
 const price=Number(document.getElementById("price").value);
 const memo=document.getElementById("memo").value;

 if(!name || !price){ alert("상품명과 가격 입력"); return; }

 products.push({category,name,price,memo});
 saveData();
 renderProducts();

 document.getElementById("name").value="";
 document.getElementById("price").value="";
 document.getElementById("memo").value="";
}

function renderProducts(){
 const list=document.getElementById("productList");
 list.innerHTML="";

 products.forEach((p,i)=>{
   list.innerHTML += `
   <div class="bg-gray-100 p-4 rounded-xl">
     <div class="text-sm text-gray-500">${p.category}</div>
     <div class="font-bold text-xl">${p.name}</div>
     <div>₩${p.price.toLocaleString()}</div>
     <div class="text-sm mt-2">${p.memo}</div>
     <button onclick="addToCart(${i})" class="bg-black text-white px-4 py-2 rounded-xl mt-3">장바구니 추가</button>
   </div>`;
 });
}

function addToCart(i){
 const p=products[i];
 cartItems.push({
   ...p,
   endTime: Date.now() + selectedMinutes*60*1000
 });
 await saveCartItem(
   cartItems[cartItems.length - 1]
 );
 saveData();
 renderCart();
 alert("추가 완료");
}

function renderCart(){
 document.getElementById("savedMoney").innerText="₩"+savedMoney.toLocaleString();
 document.getElementById("cancelCount").innerText=cancelCount;
 document.getElementById("waitingCount").innerText=cartItems.length;

 const list=document.getElementById("cartList");
 list.innerHTML="";

 cartItems.forEach((c,i)=>{
   list.innerHTML += `
   <div class="bg-gray-100 p-4 rounded-xl mb-3">
     <div class="font-bold text-xl">${c.name}</div>
     <div>₩${c.price.toLocaleString()}</div>
     <div>${c.memo||""}</div>
     <div id="timer-${i}" class="font-bold text-red-600 mt-2"></div>
     <button onclick="cancelPurchase(${i})" class="bg-black text-white px-4 py-2 rounded-xl mt-3">구매 취소</button>
   </div>`;
 });
}

function cancelPurchase(i){
 savedMoney += cartItems[i].price;
 cancelCount += 1;
 cartItems.splice(i,1);
 saveData();
 renderCart();
}

setInterval(()=>{
 cartItems.forEach((c,i)=>{
   const el=document.getElementById("timer-"+i);
   if(!el) return;
   const remain=c.endTime-Date.now();
   if(remain<=0){
     el.innerText="구매 가능";
   }else{
     const m=Math.floor(remain/1000/60);
     const s=Math.floor((remain/1000)%60);
     el.innerText=`남은 시간 ${m}분 ${s}초`;
   }
 });
},1000);

renderProducts();
renderCart();
</script>

</body>
</html>
