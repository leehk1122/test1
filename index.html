<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Delay Cart</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<div class="max-w-5xl mx-auto p-6">
  <div
id="missionSummary"
class="bg-yellow-100 p-4 rounded-xl mb-4">

<h3 class="font-bold mb-2">
🎯 이번 달 미션 진행률
</h3>

<div id="missionProgress">
아직 미션을 계산하지 않았습니다.
</div>

<div class="mt-3 font-bold text-green-700">
보유 포인트 :
<span id="pointDisplay">0</span> P
</div>

</div>

  <section id="home" class="screen">
    <div class="bg-white p-10 rounded-3xl shadow text-center mt-10">
      <h1 class="text-5xl font-bold mb-4">Smart Delay Cart</h1>
      <p class="text-gray-600 mb-8">충동구매를 잠시 멈추고 더 가치 있는 소비를 도와주는 서비스</p>
      <div class="flex justify-center gap-3">

<button
onclick="show('time')"
class="bg-black text-white px-8 py-4 rounded-2xl">
시작하기
</button>

<button
onclick="show('mission')"
class="bg-blue-600 text-white px-8 py-4 rounded-2xl">
소비 분석 & 미션
</button>

</div>
    </div>
  </section>

  <section id="time" class="screen hidden">
    <div class="bg-white p-8 rounded-3xl shadow mt-10">
      <h2 class="text-3xl font-bold mb-6">대기 시간 설정</h2>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <button onclick="setTime(30)" class="bg-gray-100 p-4 rounded-xl">30분</button>
        <button onclick="setTime(60)" class="bg-gray-100 p-4 rounded-xl">1시간</button>
        <button onclick="setTime(1440)" class="bg-gray-100 p-4 rounded-xl">24시간</button>
        <button onclick="customTime()" class="bg-gray-100 p-4 rounded-xl">직접입력</button>
      </div>

      <p class="mb-6">현재 설정: <b id="selectedTime">30분</b></p>

      <div class="flex gap-3">
        <button onclick="show('home')" class="bg-gray-300 px-5 py-3 rounded-xl">이전</button>
        <button onclick="show('shop')" class="bg-black text-white px-5 py-3 rounded-xl">다음</button>
      </div>
    </div>
  </section>

  <section id="shop" class="screen hidden">
    <div class="bg-white p-8 rounded-3xl shadow mt-10">
      <h2 class="text-3xl font-bold mb-6">상품 추가</h2>

      <div class="grid md:grid-cols-3 gap-3 mb-3">
        <select id="category" class="border p-3 rounded-xl">
          <option>전자기기</option>
          <option>패션</option>
          <option>게임</option>
          <option>취미</option>
          <option>생활용품</option>
          <option>기타</option>
        </select>

        <input id="name" class="border p-3 rounded-xl" placeholder="상품명">
        <input id="price" type="number" class="border p-3 rounded-xl" placeholder="가격">
      </div>

      <textarea id="memo" class="border p-3 rounded-xl w-full mb-4" placeholder="왜 사고 싶은지 적어보세요"></textarea>

      <div class="mt-3">
  <label class="block mb-2 font-semibold">
    개별 대기 시간 (선택)
  </label>

  <input
    id="customTimer"
    type="number"
    min="0"
    placeholder="비워두면 기본 대기 시간 사용"
    class="border p-3 rounded-xl w-full"
  />

  <p class="text-sm text-gray-500 mt-1">
    분 단위 입력 (예: 60 = 1시간)
  </p>
</div>

      <button onclick="addProduct()" class="bg-black text-white px-5 py-3 rounded-xl mb-6">상품 추가</button>

      <div id="productList" class="grid md:grid-cols-2 gap-4"></div>

      <div class="mt-6 flex gap-3">
        <button onclick="show('time')" class="bg-gray-300 px-5 py-3 rounded-xl">이전</button>
        <button onclick="show('cart')" class="bg-black text-white px-5 py-3 rounded-xl">장바구니</button>
        <button onclick="resetProducts()" class="bg-red-800 text-white px-5 py-3 rounded-xl">상품 목록 초기화</button>
      </div>
    </div>
  </section>

  <section id="cart" class="screen hidden">
    <div class="bg-white p-8 rounded-3xl shadow mt-10">
      <h2 class="text-3xl font-bold mb-6">장바구니</h2>

      <div class="grid md:grid-cols-3 gap-4 mb-6">
        <div class="bg-blue-100 p-4 rounded-xl">
          <div>절약 금액</div>
          <div id="savedMoney" class="text-2xl font-bold">₩0</div>
        </div>
        <div class="bg-green-100 p-4 rounded-xl">
          <div>취소 횟수</div>
          <div id="cancelCount" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-purple-100 p-4 rounded-xl">
          <div>대기 상품</div>
          <div id="waitingCount" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-yellow-100 p-4 rounded-xl">
          <div>구매 완료 금액</div>
          <div id="purchasedMoney" class="text-2xl font-bold">₩0</div>
        </div>
        <div class="bg-blue-100 p-4 rounded-xl">
          <div>적금 금액</div>
          <div id="depositMoney" class="text-2xl font-bold">₩0</div>
        </div>
        
        <div class="bg-green-100 p-4 rounded-xl">
          <div>투자 금액</div>
          <div id="investmentMoney" class="text-2xl font-bold">₩0</div>
        </div>
      </div>

      <div id="cartList"></div>

      <div class="bg-black text-white p-6 rounded-2xl mt-6">
        <h3 class="text-2xl font-bold mb-3">절약하면 가능한 활동</h3>
        <ul class="list-disc ml-5">
          <li>독서 및 자기계발</li>
          <li>헬스장 등록</li>
          <li>여행 적금</li>
          <li>악기 레슨</li>
        </ul>
      </div>

      <div class="flex gap-3 mt-6 flex-wrap">

  <button
    onclick="show('shop')"
    class="bg-gray-300 px-5 py-3 rounded-xl">
    이전
  </button>

  

  <button
    onclick="resetCart()"
    class="bg-red-600 text-white px-5 py-3 rounded-xl">
    장바구니 초기화
  </button>

  <button
    onclick="resetPurchasedMoney()"
    class="bg-yellow-600 text-white px-5 py-3 rounded-xl">
    구매 완료 금액 초기화
  </button>

  <button onclick="saveToDeposit()" class="bg-blue-500 text-white px-4 py-2 rounded">
적금
</button>
<button onclick="saveToInvestment()" class="bg-green-500 text-white px-4 py-2 rounded">
투자
</button>
<button onclick="showFinanceHistory()" class="bg-purple-600 text-white px-4 py-2 rounded">
내역 보기
</button>

<button onclick="withdrawDeposit()" class="bg-blue-700 text-white px-4 py-2 rounded">적금 출금
</button>
<button
onclick="withdrawSpecificDeposit()"
class="bg-blue-900 text-white px-4 py-2 rounded">
상품별 적금 출금
</button>

<button onclick="withdrawInvestment()" class="bg-green-700 text-white px-4 py-2 rounded">투자 회수</button>
      
</div>
  </section>

</div>

  <section id="mission" class="screen hidden">

<div class="bg-white p-8 rounded-3xl shadow mt-10">

<h2 class="text-3xl font-bold mb-6">
소비 분석 & 절약 미션
</h2>

<input
id="month1"
type="number"
placeholder="1개월 전 지출"
class="border p-3 rounded-xl w-full mb-3">

<input
id="month2"
type="number"
placeholder="2개월 전 지출"
class="border p-3 rounded-xl w-full mb-3">

<input
id="month3"
type="number"
placeholder="3개월 전 지출"
class="border p-3 rounded-xl w-full mb-3">

<button
onclick="calculateMission()"
class="bg-black text-white px-5 py-3 rounded-xl mb-4">

미션 계산

</button>

<div id="missionResult"></div>

<div class="mt-5">

<button
onclick="show('home')"
class="bg-gray-300 px-5 py-3 rounded-xl">

홈으로

</button>

</div>

</div>

</section>

<script>
const depositProducts = [{name:"국민은행 청년적금", rate:4.2},{ name:"신한은행 자유적금", rate:3.8},{ name:"카카오뱅크 정기적금", rate:4.0},
{ name:"토스뱅크 자유적금", rate:3.9}];
const investmentProducts = [{ name:"삼성전자", risk:"중"},{ name:"TIGER 미국S&P500", risk:"낮음"},{ name:"KODEX 나스닥100", risk:"중"},
{ name:"테슬라", risk:"높음"},{ name:"엔비디아", risk:"높음"}];
let selectedMinutes = 30;
let products = JSON.parse(localStorage.getItem("products") || "[]");
let cartItems = JSON.parse(localStorage.getItem("cartItems") || "[]");
let savedMoney = Number(localStorage.getItem("savedMoney") || 0);
let cancelCount = Number(localStorage.getItem("cancelCount") || 0);
let purchasedMoney = Number(localStorage.getItem("purchasedMoney") || 0);
let purchasedCount = Number(localStorage.getItem("purchasedCount") || 0);
let missionData =
JSON.parse(
localStorage.getItem("missionData") || "{}"
);
let points =
Number(
localStorage.getItem("points") || 0
);

let easyRewardClaimed =
JSON.parse(
localStorage.getItem(
"easyRewardClaimed"
) || "false"
);

let normalRewardClaimed =
JSON.parse(
localStorage.getItem(
"normalRewardClaimed"
) || "false"
);

let hardRewardClaimed =
JSON.parse(
localStorage.getItem(
"hardRewardClaimed"
) || "false"
);

let pet = {
  level: 1,
  exp: 0,
  hunger: 100,
  happiness: 50
};

let finance =
JSON.parse(
 localStorage.getItem("finance")
 ||
 '{"deposit":0,"investment":0,"profit":0,"depositHistory":[],"investmentHistory":[]}');

function saveData(){
 savedMoney =
 Math.floor(savedMoney);

 purchasedMoney =
 Math.floor(purchasedMoney);

 finance.deposit =
 Math.floor(finance.deposit);

 finance.investment =
 Math.floor(finance.investment);

 finance.profit =
 Math.floor(finance.profit);
 localStorage.setItem("products",JSON.stringify(products));
 localStorage.setItem("cartItems",JSON.stringify(cartItems));
 localStorage.setItem("savedMoney",savedMoney);
 localStorage.setItem("cancelCount",cancelCount);
 localStorage.setItem("purchasedMoney",purchasedMoney);
 localStorage.setItem("purchasedCount",purchasedCount);
 localStorage.setItem(
"missionData",
JSON.stringify(missionData)
);
 localStorage.setItem(
 "points",
 points
);
localStorage.setItem(
"easyRewardClaimed",
easyRewardClaimed
);

localStorage.setItem(
"normalRewardClaimed",
normalRewardClaimed
);

localStorage.setItem(
"hardRewardClaimed",
hardRewardClaimed
);

  localStorage.setItem(
 "finance",
 JSON.stringify(finance)
);
}

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function setTime(min){
 selectedMinutes=min;
 document.getElementById("selectedTime").innerText=min>=60?(min/60)+"시간":min+"분";
}

function customTime(){
 const v=prompt("분 단위 입력");
 if(v && !isNaN(v)) setTime(Number(v));
}

function addProduct(){
 const category=document.getElementById("category").value;
 const name=document.getElementById("name").value;
 const price=Number(document.getElementById("price").value);
 const memo=document.getElementById("memo").value;
 const customTimer=Number(document.getElementById("customTimer").value) || 0;

 if(!name || !price){ alert("상품명과 가격 입력"); return; }

 products.push({category,name,price,memo,customTimer});
 saveData();
 renderProducts();

 document.getElementById("name").value="";
 document.getElementById("price").value="";
 document.getElementById("memo").value="";
 document.getElementById("customTimer").value="";
}

function resetProducts(){

  if(confirm("정말 상품 목록을 초기화하시겠습니까?")){

    products = [];

    saveData();

    renderProducts();

    alert("상품 목록이 초기화되었습니다.");
  }
}

function renderProducts(){
 const list=document.getElementById("productList");
 list.innerHTML="";

 products.forEach((p,i)=>{
   list.innerHTML += `
   <div class="bg-gray-100 p-4 rounded-xl">
     <div class="text-sm text-gray-500">${p.category}</div>
     <div class="font-bold text-xl">${p.name}</div>
     <div>₩${p.price.toLocaleString()}</div>
     <div class="text-sm mt-2">${p.memo}</div>
     <button onclick="addToCart(${i})" class="bg-black text-white px-4 py-2 rounded-xl mt-3">장바구니 추가</button>
   </div>`;
 });
}

function addToCart(i){
 const p=products[i];
 const finalMinutes =
  p.customTimer > 0
    ? p.customTimer
    : selectedMinutes;
  cartItems.push({
   ...p,
   endTime:
      Date.now() +
      finalMinutes * 60 * 1000,
   usedTimer:
      finalMinutes
});
 saveData();
 renderCart();
 alert("추가 완료");
}

function renderCart(){
 document.getElementById("savedMoney").innerText="₩"+savedMoney.toLocaleString();
 document.getElementById("cancelCount").innerText=cancelCount;
 document.getElementById("waitingCount").innerText=cartItems.length;

 document.getElementById("purchasedMoney").innerText =
   "₩" + purchasedMoney.toLocaleString();
 
 document.getElementById(
  "depositMoney"
  ).innerText =
  "₩" +
 finance.deposit.toLocaleString();
  
  document.getElementById(
  "investmentMoney"
  ).innerText =
  "₩" +
  Math.round(
   finance.investment
  ).toLocaleString();

 const list=document.getElementById("cartList");
 list.innerHTML="";

 cartItems.forEach((c,i)=>{
   list.innerHTML += `
   <div class="bg-gray-100 p-4 rounded-xl mb-3">
     <div class="font-bold text-xl">${c.name}</div>
     <div>₩${c.price.toLocaleString()}</div>
     <div>${c.memo||""}</div>
     <div class="text-blue-600 font-semibold">
  설정 시간 :
  ${c.usedTimer}분
</div>
     <div id="timer-${i}" class="font-bold text-red-600 mt-2"></div>
     <button onclick="cancelPurchase(${i})" class="bg-black text-white px-4 py-2 rounded-xl mt-3">구매 취소</button>
     <button onclick="completePurchase(${i})" class="bg-green-600 text-white px-4 py-2 rounded-xl mt-2">구매 완료</button>
   </div>`;
 });
}

function cancelPurchase(i){

 const item = cartItems[i];

 savedMoney += item.price;

 cancelCount += 1;

 pet.exp += Math.floor(
   item.price / 10000
 );

 if(pet.exp >= pet.level * 100){
   pet.level += 1;
   pet.exp = 0;
   alert("다마고치가 성장했습니다!");
 }

 cartItems.splice(i,1);

 saveData();

 renderCart();

 updateMissionSummary();
}

saveData();
 



function resetCart(){

  if(confirm("정말 장바구니를 초기화하시겠습니까?")){

    cartItems = [];

    savedMoney = 0;

    cancelCount = 0;
    finance.depositHistory = [];
    finance.investmentHistory = [];

    easyRewardClaimed = false;
    normalRewardClaimed = false;
    hardRewardClaimed = false;

    saveData();

    renderCart();

    updateMissionSummary();

    alert("장바구니와 절약 통계가 초기화되었습니다.");
  }
}

function resetPurchasedMoney(){

  if(confirm("정말 구매 완료 금액을 초기화하시겠습니까?")){

    purchasedMoney = 0;

    purchasedCount = 0;

    saveData();

    renderCart();

    alert("구매 완료 금액이 초기화되었습니다.");
  }
}

setInterval(()=>{
 cartItems.forEach((c,i)=>{
   const el=document.getElementById("timer-"+i);
   if(!el) return;
   const remain=c.endTime-Date.now();
   if(remain<=0){
     el.innerText="구매 가능";
   }else{
     const m=Math.floor(remain/1000/60);
     const s=Math.floor((remain/1000)%60);
     el.innerText=`남은 시간 ${m}분 ${s}초`;
   }
 });
},1000);

function completePurchase(i){

  const item = cartItems[i];

  if(Date.now() < item.endTime){

    alert(
      "아직 대기 시간이 남아 있습니다."
    );

    return;
  }

  purchasedMoney += item.price;

  purchasedCount += 1;

  cartItems.splice(i,1);

  saveData();

  renderCart();

  alert("구매가 기록되었습니다.");
}

function calculateMission(){

 const m1 =
 Number(
 document.getElementById("month1").value
 ) || 0;

 const m2 =
 Number(
 document.getElementById("month2").value
 ) || 0;

 const m3 =
 Number(
 document.getElementById("month3").value
 ) || 0;

 const avg =
 Math.round(
 (m1+m2+m3)/3
 );

 const easy =
 Math.round(avg*0.05);

 const normal =
 Math.round(avg*0.10);

 const hard =
 Math.round(avg*0.20);

missionData = {
 m1,m2,m3,
 avg,
 easy,
 normal,
 hard,
};

 saveData();

const easyRate =
 missionData.easy > 0
 ? Math.min(
     (savedMoney/missionData.easy)*100,
     100
   ).toFixed(1)
 : 0;

const normalRate =
 missionData.normal > 0
 ? Math.min(
     (savedMoney/missionData.normal)*100,
     100
   ).toFixed(1)
 : 0;

const hardRate =
 missionData.hard > 0
 ? Math.min(
     (savedMoney/missionData.hard)*100,
     100
   ).toFixed(1)
 : 0;

 document.getElementById(
 "missionResult"
 ).innerHTML = `

 <div class="bg-gray-100 p-5 rounded-xl">

 <p>
 <b>평균 월 지출:</b>
 ₩${avg.toLocaleString()}
 </p>

 <hr class="my-3">

 <p>
 EASY :
 ₩${easy.toLocaleString()}
 목표
 (진행률 ${easyRate}%)
 </p>

 <p>
 NORMAL :
 ₩${normal.toLocaleString()}
 목표
 (진행률 ${normalRate}%)
 </p>

 <p>
 HARD :
 ₩${hard.toLocaleString()}
 목표
 (진행률 ${hardRate}%)
 </p>

 </div>

 `;
 
  saveData();
  updateMissionSummary();
}

function updateMissionSummary(){

if(
 savedMoney >= missionData.easy &&
 !easyRewardClaimed
){

 points += 50;

 easyRewardClaimed = true;

 saveData();
}

if(
 savedMoney >= missionData.normal &&
 !normalRewardClaimed
){

 points += 100;

 normalRewardClaimed = true;

 saveData();
}

if(
 savedMoney >= missionData.hard &&
 !hardRewardClaimed
){

 points += 300;

 hardRewardClaimed = true;

 saveData();
}

 if(!missionData.avg){

  document.getElementById(
   "missionProgress"
  ).innerHTML =
   "아직 미션을 계산하지 않았습니다.";

  return;
 }

 const easyRate =
 missionData.easy > 0
 ? Math.min(
     ((savedMoney/missionData.easy)*100),
     100
   ).toFixed(1)
 : 0;

const normalRate =
 missionData.normal > 0
 ? Math.min(
     ((savedMoney/missionData.normal)*100),
     100
   ).toFixed(1)
 : 0;

const hardRate =
 missionData.hard > 0
 ? Math.min(
     ((savedMoney/missionData.hard)*100),
     100
   ).toFixed(1)
 : 0;

 document.getElementById(
 "missionProgress"
 ).innerHTML = `

 Easy :
 ${easyRate}%

 <br>

 Normal :
 ${normalRate}%

 <br>

 Hard :
 ${hardRate}%

 `;

  document.getElementById(
 "pointDisplay"
).innerText = points;
}

function saveToDeposit(){

 let menu = "적금 상품 선택(숫자만 입력해주세요.)\n\n";

 depositProducts.forEach((p,index)=>{
   menu +=
   (index+1) +
   ". " +
   p.name +
   " (" +
   p.rate +
   "%)\n";
 });

 let choice =
 Number(prompt(menu));

 if(
   !choice ||
   choice < 1 ||
   choice > depositProducts.length
 ){
   return;
 }

 let product =
 depositProducts[choice-1];

 let amount =
 Number(
   prompt(
     product.name +
     "\n\n적금 금액 입력(숫자만 입력해주세요.)"
   )
 );

 if(!amount || amount <= 0){
   return;
 }

 if(amount > savedMoney){

   alert(
     "절약 금액보다 많이 입력할 수 없습니다."
   );

   return;
 }

 amount = Math.floor(amount);

 finance.deposit += amount;

 if(!finance.depositHistory){
   finance.depositHistory = [];
 }

 finance.depositHistory.push({
   product: product.name,
   rate: product.rate,
   amount: amount,
   date: new Date().toLocaleDateString()
 });

 savedMoney -= amount;

 saveData();

 renderCart();

 alert(
   product.name +
   "\n" +
   amount.toLocaleString() +
   "원 가입 완료"
 );
}
  
function saveToInvestment(){

 let menu = "투자 상품 선택(숫자만 입력해주세요.)\n\n";

 investmentProducts.forEach((p,index)=>{
   menu +=
   (index+1) +
   ". " +
   p.name +
   " (위험도:" +
   p.risk +
   ")\n";
 });

 let choice =
 Number(prompt(menu));

 if(
   !choice ||
   choice < 1 ||
   choice > investmentProducts.length
 ){
   return;
 }

 let product =
 investmentProducts[choice-1];

 let amount =
 Number(
   prompt(
     product.name +
     "\n\n투자 금액 입력(숫자만 입력해주세요.)"
   )
 );

 if(!amount || amount <= 0){
   return;
 }

 if(amount > savedMoney){

   alert(
     "절약 금액보다 많이 입력할 수 없습니다."
   );

   return;
 }

 amount = Math.floor(amount);

 let randomRate =
 Math.random() * 0.2 - 0.1;

 let result =
 Math.floor(
   amount +
   amount * randomRate
 );

 finance.investment += result;

 finance.profit +=
 (result - amount);

 if(!finance.investmentHistory){
   finance.investmentHistory = [];
 }

 finance.investmentHistory.push({
   product: product.name,
   amount: amount,
   currentValue: result,
   risk: product.risk,
   date: new Date().toLocaleDateString()
 });

 savedMoney -= amount;

 saveData();

 renderCart();

 alert(
   product.name +
   "\n\n투자금 : " +
   amount.toLocaleString() +
   "원\n" +
   "현재 가치 : " +
   result.toLocaleString() +
   "원"
 );
}

function withdrawSpecificDeposit(){

 if(
   !finance.depositHistory ||
   finance.depositHistory.length === 0
 ){
   alert("적금 내역이 없습니다.");
   return;
 }

 let menu =
 "출금할 적금 선택\n\n";

 finance.depositHistory.forEach(
 (item,index)=>{

   menu +=
   (index+1) +
   ". " +
   item.product +
   " (" +
   item.amount.toLocaleString() +
   "원)\n";
 });

 let choice =
 Number(prompt(menu));

 if(
   !choice ||
   choice < 1 ||
   choice > finance.depositHistory.length
 ){
   return;
 }

 let target =
 finance.depositHistory[
   choice-1
 ];

 let amount =
 Number(
   prompt(
     "출금 금액 입력\n현재 : " +
     target.amount.toLocaleString() +
     "원"
   )
 );

 if(
   !amount ||
   amount <= 0
 ){
   return;
 }

 if(
   amount > target.amount
 ){
   alert("현재 적금 금액보다 많습니다.");
   return;
 }

 amount =
 Math.floor(amount);

 target.amount -= amount;

 finance.deposit -= amount;

 savedMoney += amount;

 if(target.amount <= 0){

   finance.depositHistory.splice(
     choice-1,
     1
   );
 }

 saveData();

 renderCart();

 alert(
   amount.toLocaleString() +
   "원 출금 완료"
 );
}
  
renderProducts();
renderCart();
updateMissionSummary();
